[project]
name = "autoboost-agent"
version = "0.1.0"
description = "AI agent that monitors franchise social media posts and auto-boosts high-performing content on Meta"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Soham Mehrotra", email = "mohso@uw.edu" }
]

dependencies = [
    "langchain>=0.2.0",
    "langchain-anthropic>=0.1.0",
    "langchain-core>=0.2.0",
    "anthropic>=0.28.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "apscheduler>=3.10.0",
    "slack-sdk>=3.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
